[project]
name = "domjudge-simple-signup"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [
    {name = "jasonxie", email = "x5758x@gmail.com"},
]
dependencies = [
    "domjudge-tool-cli>=0.4.0,<0.5",
    "environs>=15.2.0,<16",
    "httpx>=0.28.1,<0.29",
    "pydantic[email]>=2.13.5,<3",
    "streamlit>=1.63.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "ruff==0.16.6",
    "ty==0.0.80",
    "watchdog>=6.0.0,<7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py313"
src = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["core", "ui"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.environment]
root = ["./src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
